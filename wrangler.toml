# wrangler.toml — Meridian
# After creating your D1 database, replace YOUR_DATABASE_ID below.
# Run: npx wrangler d1 create meridian-db
# Then copy the database_id from the output into this file.

name = "meridian"
pages_build_output_dir = "."
compatibility_date = "2024-01-01"

[[d1_databases]]
binding     = "DB"
database_name = "meridian-db"
database_id   = "YOUR_DATABASE_ID"

# Environment variables are set in the Cloudflare dashboard or via:
#   npx wrangler secret put AUTH_TOKEN
#   npx wrangler secret put ANTHROPIC_API_KEY
#
# Optional:
#   npx wrangler secret put GCAL_CLIENT_ID
