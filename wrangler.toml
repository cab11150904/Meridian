# wrangler.toml — Meridian
# After creating your D1 database, replace YOUR_DATABASE_ID below.
# Run: npx wrangler d1 create meridian-db

name = "meridian"
pages_build_output_dir = "."
compatibility_date = "2024-01-01"

[[d1_databases]]
binding       = "DB"
database_name = "meridian-db"
database_id   = "YOUR_DATABASE_ID"

# Secrets — set via Cloudflare dashboard or:
#   npx wrangler secret put GCAL_CLIENT_ID
#   npx wrangler secret put ANTHROPIC_API_KEY
#
# GCAL_CLIENT_ID  — Google OAuth Client ID (handles both login and Calendar)
# ANTHROPIC_API_KEY — Your Anthropic API key (never sent to the browser)
